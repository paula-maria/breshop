services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: breshop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d breshop"]
      interval: 3s
      retries: 10

  app:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://admin:adminpassword@db:5432/breshop?schema=public
      JWT_SECRET: troque-este-segredo
      SEED_ON_START: "true" # popula dados de teste (idempotente); remova em produção
    ports:
      - "3333:3333"
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
